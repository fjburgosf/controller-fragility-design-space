method:
  name: ig_rrl_v3
  residual_limit_v: 4.0
  actuator_limit_v: 12.0
  gate:
    lambda: 0.10
    eta_bar: 10.0
    tau: 2.0
    rho_min: 0.30
    rho_max: 1.00
    nis_dimension: 2

ablations:
  a1_no_domain_randomization: minimum
  a2_fixed_minimum_authority: minimum
  a3_fixed_maximum_authority: maximum
  p2_innovation_gated: innovation

protocol:
  policy_seeds: [4101, 4102, 4103, 4104, 4105]
  design_lhs_samples: 48
  validation_sets: [MC1, MC2, MC3]

training_environment:
  task: stabilization_only
  dt_s: 0.02
  episode_s: 8.0
  measurement_noise_std: 0.001
  gate_warmup_s: 1.5
  domain_randomization:
    Mp: [-0.20, 0.20]
    Jp: [-0.25, 0.25]
    l: [-0.15, 0.15]
    kt: [-0.10, 0.10]
  perturbation_probability: 0.50
